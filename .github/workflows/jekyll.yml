name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_state.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Check GitHub Pages availability
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == "200" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::GitHub Pages is not enabled. The site will be built and its artifact retained; deployment will be skipped.'
          else
            echo "Unable to check GitHub Pages status (HTTP ${status})." >&2
            exit 1
          fi
      - name: Configure GitHub Pages
        id: pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path || '/LJT-Homepage' }}"
        env:
          JEKYLL_ENV: production
      - name: Verify both publication lists
        run: |
          test "$(grep -o publication-entry _site/index.html | wc -l)" -eq 6
          test "$(grep -o publication-entry _site/publications/index.html | wc -l)" -eq 6
          echo 'Verified six publication entries on both About and Publications.'
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
